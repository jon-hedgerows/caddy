name: github-build-and-upload

on:
  # Trigger the action manually from the UI
  workflow_dispatch:
  # Trigger the action when any tag is pushed
  push:
    tags:
      - "**"

jobs:
  dockerfile-matrix:
    name: List Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dockerfile-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List Dockerfiles
        id: dockerfile-matrix
        run: |
          echo "matrix=$(ls Dockerfile.* | sed 's/Dockerfile.//' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: dockerfile-matrix
    strategy:
      matrix:
        dockerfiles: ${{ fromJSON(needs.dockerfile-matrix.outputs.matrix) }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository }}-${{ matrix.dockerfiles }}
          tags: |
            type=schedule,pattern={{date 'YYYYMMDD'}}
            # output 0.1.2
            type=semver,pattern={{version}}
            # output 0.1
            type=semver,pattern={{major}}.{{minor}}
            # disabled if major zero
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Generate SHA tag ONLY if the current reference is not a git tag
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.dockerfiles }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      # attestation only works for public repositories
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.dockerfiles }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
